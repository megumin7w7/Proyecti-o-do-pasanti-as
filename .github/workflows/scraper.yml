name: Pipeline de Scraping Laboral AI

on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * *'

jobs:
  scrape-jobs:
    runs-on: ubuntu-22.04
    
    steps:
      - name: 📥 Descargar el código del repositorio
        uses: actions/checkout@v4

      # NUEVO: Instalamos uv para acelerar las descargas de Python al máximo
      - name: ⚡ Configurar instalador uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "requirements.txt"

      - name: 🐍 Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          # Quitamos el caché de aquí, uv lo manejará de forma más eficiente

      - name: 📦 Instalar dependencias del proyecto (Acelerado)
        # Reemplazamos pip install por uv pip install
        run: uv pip install --system -r requirements.txt

      - name: 🗂️ Obtener versión exacta de Playwright
        id: playwright-version
        run: echo "VERSION=$(pip show playwright | grep Version | awk '{print $2}')" >> $GITHUB_ENV

      - name: 💾 Caché del navegador Chromium de Playwright
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ env.VERSION }}

      - name: 🌐 Instalar navegadores Playwright (Solo si no hay caché)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install chromium
        
      - name: ⚙️ Instalar dependencias del sistema operativo (Requerido siempre)
        run: playwright install-deps chromium

      # ==========================================
      # 🚀 NUEVO PASO: INSTALAR MONITOR VIRTUAL
      # ==========================================
      - name: 🖥️ Instalar Xvfb para evadir Anti-Bots
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: 🚀 Ejecutar el Pipeline de Scraping
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        # 🚀 MODIFICACIÓN: Agregamos xvfb-run antes de python main.py
        run: xvfb-run python main.py
        continue-on-error: true

      - name: 📸 Subir logs y debug
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-debug-artifacts
          path: |
            *.png
            *.html
          retention-days: 3
          if-no-files-found: ignore
