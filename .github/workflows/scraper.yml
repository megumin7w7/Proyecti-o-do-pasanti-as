name: Pipeline de Scraping Laboral AI

on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * *'

jobs:
  scrape-jobs:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # Caché de dependencias de Python

      - name: 📦 Instalar dependencias del proyecto
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m spacy download es_core_news_md

      - name: 🗂️ Obtener versión exacta de Playwright
        id: playwright-version
        run: echo "VERSION=$(pip show playwright | grep Version | awk '{print $2}')" >> $GITHUB_ENV

      - name: 💾 Caché del navegador Chromium de Playwright
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ env.VERSION }}

      - name: 🌐 Instalar navegadores Playwright (Solo si no hay caché)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install chromium
        
      - name: ⚙️ Instalar dependencias del sistema operativo (Requerido siempre)
        run: playwright install-deps chromium

      - name: 🚀 Ejecutar el Pipeline de Scraping
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: python main.py
        continue-on-error: true

      - name: 📸 Subir logs y debug
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-debug-artifacts
          path: |
            *.png
            *.html
          retention-days: 3
          if-no-files-found: ignore
