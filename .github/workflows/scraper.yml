name: Pipeline de Scraping Laboral AI

on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * *'

jobs:
  scrape-jobs:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Instalar dependencias de Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright-stealth

      - name: 🌐 Instalar Chromium y dependencias del sistema
        run: |
          playwright install chromium
          playwright install-deps chromium
          python -m spacy download es_core_news_md

      - name: 🚀 Ejecutar el Pipeline de Scraping
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: python main.py
        continue-on-error: true  # ✅ CLAVE: Permite que el siguiente paso se ejecute incluso si falla

      - name: 📸 Subir debug (screenshots + HTML)
        if: always()  # ✅ CLAVE: Se ejecuta siempre, incluso si el job anterior falló
        uses: actions/upload-artifact@v4
        with:
          name: bumeran-debug-artifacts
          path: |
            *.png
            *.html
          retention-days: 3
          if-no-files-found: ignore
