name: Pipeline de Scraping Laboral AI

on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * *'

jobs:
  scrape-jobs:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Instalar dependencias de Python
        run: |
          python -m pip install --upgrade pip
          # 1. Dependencias base (las mismas de Streamlit)
          pip install -r requirements.txt
          # 2. Dependencias EXCLUSIVAS del scraper (que no están en requirements.txt)
          pip install spacy playwright playwright-stealth loguru python-dotenv
          # 3. Descargar modelo de spaCy (AHORA SÍ FUNCIONARÁ porque spacy ya está instalado)
          python -m spacy download es_core_news_md

      - name: 🌐 Instalar Chromium y dependencias del sistema
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: 🚀 Ejecutar el Pipeline de Scraping
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: python main.py
        continue-on-error: true  # Permite que el paso de debug se ejecute aunque el scraper falle

      - name: 📸 Subir debug (screenshots + HTML)
        if: always()  # Se ejecuta SIEMPRE, incluso si el paso anterior falló
        uses: actions/upload-artifact@v4
        with:
          name: bumeran-debug-artifacts
          path: |
            *.png
            *.html
          retention-days: 3
          if-no-files-found: ignore
