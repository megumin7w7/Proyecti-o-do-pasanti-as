name: Executar Scraper de Empleos

on:
  schedule:
    - cron: '0 */6 * * *'  # Se ejecuta cada 6 horas (Ajusta si deseas)
  workflow_dispatch:        # Permite ejecutarlo manualmente desde GitHub

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      # 1. Obtener el código del repositorio (Versión v4)
      - name: Checkout del código
        uses: actions/checkout@v4

      # 2. Configurar Python con caché automático para PIP
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # ⚡ Guarda en caché las librerías de requirements.txt

      # 3. Instalar librerías de Python
      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # 4. CACHÉ DE PLAYWRIGHT (Evita re-descargar Chromium cada vez)
      - name: Verificar/Cargar caché de Playwright
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/requirements.txt') }}

      # 5. Instalar Chromium SOLO si no estaba en caché
      - name: Instalar navegador Playwright
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          python -m playwright install chromium --with-deps

      # 6. Ejecutar el Scraper
      - name: Ejecutar Scraper Principal
        run: python main.py

      # 7. Subir imágenes si ocurre algún error (Sin generar warnings molestos)
      - name: Guardar capturas de error (Si existen)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-error
          path: '*.png'
          if-no-files-found: ignore # ⚡ Silencia el warning si no hay PNGs
