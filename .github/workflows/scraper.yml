name: Pipeline de Scraping Laboral AI

on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * *'

jobs:
  scrape-jobs:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Instalar dependencias de Python
        run: |
          python -m pip install --upgrade pip
          # 1. Instalar lo básico del requirements.txt (para Streamlit y base)
          pip install -r requirements.txt
          # 2. Instalar dependencias pesadas EXCLUSIVAS del scraper (GitHub Actions)
          pip install playwright playwright-stealth loguru spacy python-dotenv
          python -m spacy download es_core_news_md

      - name: 🌐 Instalar Chromium y dependencias del sistema
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: 🚀 Ejecutar el Pipeline de Scraping
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: python main.py

      - name: 📸 Guardar evidencia de fallos (Debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bumeran-debug-screenshots
          path: |
            bumeran_bloqueo.png
            bumeran_vacia.png
          if-no-files-found: ignore
