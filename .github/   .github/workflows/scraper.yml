name: Pipeline de Scraping Laboral AI

# Se ejecuta manualmente con un botón o programado (ej: todos los días a la 1 PM hora Perú)
on:
  workflow_dispatch: # Permite ejecutarlo manualmente desde la pestaña "Actions"
  schedule:
    - cron: '0 18 * * *' # Ejemplo: todos los días a las 18:00 UTC (1 PM en Perú)

jobs:
  scrape-jobs:
    runs-on: ubuntu-latest # Usa una máquina virtual Linux limpia y gratuita
    
    steps:
      - name: 📥 Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Instalar dependencias de Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🌐 Instalar Chromium y dependencias del sistema (Aquí funciona perfecto)
        run: |
          playwright install chromium
          playwright install-deps chromium
          python -m spacy download es_core_news_md

      - name: 🚀 Ejecutar el Pipeline de Scraping
        env:
          # Inyectamos tu credencial de Google de forma 100% segura
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: python main.py
